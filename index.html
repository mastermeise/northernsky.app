<body>
<div class="breath" aria-hidden="true"></div>

<div class="shell">
  <header>
    <div class="wrap">
      <a class="mark" href="./" aria-label="Northern Sky">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 C33.8 24.8 36.8 29 56 32 C36.8 35 33.8 39.2 32 56 C30.2 39.2 27.2 35 8 32 C27.2 29 30.2 24.8 32 8 Z" fill="currentColor"/></svg>
        Northern Sky
      </a>
    </div>
  </header>

  <main class="hero">
    <div class="wrap">
      <p class="eyebrow">Coming to iPhone</p>
      <h1>Two questions, every morning.</h1>
      <p class="lede">What's the one thing you'll do today? What are you thankful for? Tomorrow, it asks whether you did it.</p>

      <form class="capture" id="capture" novalidate>
        <div class="row">
          <label class="hp" for="website">Leave this empty</label>
          <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          <input type="email" id="email" name="email" placeholder="Your email" required
                 autocomplete="email" autocapitalize="off" spellcheck="false" aria-label="Your email">
          <button class="pill" type="submit" data-goatcounter-click="waitlist">Tell me when it's out</button>
        </div>
        <p class="note" id="note" aria-live="polite">One note when it's out, the occasional one after. Unsubscribe anytime.</p>
      </form>
    </div>
  </main>

  <footer>
    <div class="wrap">

      </nav>
    </div>
  </footer>
</div>

<script>
// The waitlist is one table in the app's Supabase project. The key is the
// project's publishable identifier, not a secret; the table grants anon
// insert only, and RLS lets nothing be read back. A duplicate email comes
// back 409 and is treated as already on the list.
(function () {
  var URL = 'https://xiwggtpiqnsiargtiham.supabase.co/rest/v1/waitlist';
  var KEY = 'sb_publishable_mRfgL_a6vdINKT1QcsDXOg_ihpGNKJz';
  var COPY = {
    expectation: 'One note when it’s out, the occasional one after. Unsubscribe anytime.',
    invalid: 'That doesn’t look like an email address.',
    done: 'You’re on the list.',
    failed: 'That didn’t send. Try once more.'
  };
  var form = document.getElementById('capture');
  var email = document.getElementById('email');
  var note = document.getElementById('note');
  var button = form.querySelector('.pill');

  function say(state, text) { note.dataset.state = state; note.textContent = text; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.website.value) return;               // honeypot
    var value = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) { say('error', COPY.invalid); email.focus(); return; }
    button.disabled = true;
    fetch(URL, {
      method: 'POST',
      headers: {
        'apikey': KEY,
        'Authorization': 'Bearer ' + KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ email: value.toLowerCase(), source: 'northernsky.app' })
    }).then(function (r) {
      if (r.ok || r.status === 409) { say('done', COPY.done); form.reset(); }
      else { say('error', COPY.failed); button.disabled = false; }
    }).catch(function () { say('error', COPY.failed); button.disabled = false; });
  });
  email.addEventListener('input', function () { if (note.dataset.state === 'error') say('', COPY.expectation); });
})();
</script>
