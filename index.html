<body class="wake">
<div class="sky" aria-hidden="true">
  <div class="layer day"></div>
  <div class="layer horizon"></div>
  <div class="layer night"></div>
  <div class="stars" id="stars"></div>
</div>
<div class="breath" aria-hidden="true"></div>

<div class="shell">
  <header>
    <div class="wrap">
      <a class="mark" href="./" aria-label="Northern Sky">
        <span class="word" aria-hidden="true">Northern Sky</span>
        <span class="polaris" aria-hidden="true">
          <i class="glow"></i>
          <svg viewBox="0 0 64 64"><path d="M32 8 C33.8 24.8 36.8 29 56 32 C36.8 35 33.8 39.2 32 56 C30.2 39.2 27.2 35 8 32 C27.2 29 30.2 24.8 32 8 Z" fill="currentColor"/></svg>
        </span>
      </a>
    </div>
  </header>

  <main class="hero">
    <div class="wrap">
      <p class="eyebrow rise" style="--i:0">Coming to iPhone</p>
      <h1 class="rise" style="--i:1">Two questions, every morning.</h1>
      <p class="lede rise" style="--i:2">What's the one thing you'll do today? What are you thankful for? Tomorrow, it asks whether you did it.</p>

      <form class="capture rise" style="--i:3" id="capture" novalidate>
        <div class="row">
          <label class="hp" for="website">Leave this empty</label>
          <input class="hp" type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          <input type="email" id="email" name="email" placeholder="Your email" required
                 autocomplete="email" autocapitalize="off" spellcheck="false" aria-label="Your email">
          <button class="pill" type="submit" data-goatcounter-click="waitlist">Tell me when it's out</button>
        </div>
        <p class="note" id="note" aria-live="polite">One note when it's out, the occasional one after. Unsubscribe anytime.</p>
      </form>
    </div>
  </main>

  <footer class="rise" style="--i:5">
    <div class="wrap">
      <span>© 2026 Brian Meise</span>
      <nav>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="support.html">Support</a>
      </nav>
    </div>
  </footer>
</div>

<script>
// The sky wakes. The wordmark is split into letters so each can resolve on its own beat, and
// the stars are seeded here so no two mornings share a sky: each star carries its position,
// size, brightness, wake delay and twinkle period as custom properties the stylesheet reads.
// All of it is transform and opacity; the stylesheet skips the intro under reduced motion.
(function () {
  var word = document.querySelector('.word');
  var text = word.textContent; word.textContent = '';
  for (var i = 0; i < text.length; i++) {
    var s = document.createElement('span'); s.textContent = text[i]; s.style.setProperty('--i', i); word.appendChild(s);
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  var stars = document.getElementById('stars');
  var frag = document.createDocumentFragment();
  for (var n = 0; n < 150; n++) {
    var el = document.createElement('i');
    var big = Math.random() < 0.12;
    el.className = 'star' + (big ? ' bright' : '') + (Math.random() < 0.18 ? ' warm' : '');
    el.style.setProperty('--x', rnd(0, 100).toFixed(2) + '%');
    el.style.setProperty('--y', rnd(0, 100).toFixed(2) + '%');
    el.style.setProperty('--s', (big ? rnd(2.4, 3.6) : rnd(1, 2.2)).toFixed(2) + 'px');
    el.style.setProperty('--o', (big ? rnd(.75, 1) : rnd(.35, .85)).toFixed(2));
    var d = rnd(0.5, 2.4);
    el.style.setProperty('--d', d.toFixed(2) + 's');
    el.style.setProperty('--d2', (d + 1.4).toFixed(2) + 's');
    el.style.setProperty('--t', (Math.random() < 0.25 ? rnd(0.9, 1.8) : rnd(2.2, 6)).toFixed(2) + 's');
    frag.appendChild(el);
  }
  stars.appendChild(frag);
})();

// The waitlist is one table in the app's Supabase project. The key is the
// project's publishable identifier, not a secret; the table grants anon
// insert only, and RLS lets nothing be read back. A duplicate email comes
// back 409 and is treated as already on the list.
(function () {
  var URL = 'https://xiwggtpiqnsiargtiham.supabase.co/rest/v1/waitlist';
  var KEY = 'sb_publishable_mRfgL_a6vdINKT1QcsDXOg_ihpGNKJz';
  var COPY = {
    expectation: 'One note when it’s out, the occasional one after. Unsubscribe anytime.',
    invalid: 'That doesn’t look like an email address.',
    done: 'You’re on the list.',
    failed: 'That didn’t send. Try once more.'
  };
  var form = document.getElementById('capture');
  var email = document.getElementById('email');
  var note = document.getElementById('note');
  var button = form.querySelector('.pill');

  function say(state, text) { note.dataset.state = state; note.textContent = text; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (form.website.value) return;               // honeypot
    var value = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) { say('error', COPY.invalid); email.focus(); return; }
    button.disabled = true;
    fetch(URL, {
      method: 'POST',
      headers: {
        'apikey': KEY,
        'Authorization': 'Bearer ' + KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ email: value.toLowerCase(), source: 'northernsky.app' })
    }).then(function (r) {
      if (r.ok || r.status === 409) { say('done', COPY.done); form.reset(); }
      else { say('error', COPY.failed); button.disabled = false; }
    }).catch(function () { say('error', COPY.failed); button.disabled = false; });
  });
  email.addEventListener('input', function () { if (note.dataset.state === 'error') say('', COPY.expectation); });
})();
</script>
